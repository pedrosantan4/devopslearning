name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
    
    - name: Check for README-only changes
      id: check_readme
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          # Para pull requests, compara com a branch base
          git diff --name-only origin/${{ github.base_ref }} HEAD > changed_files.txt
        else
          # Para pushes, compara com o último commit
          git diff --name-only HEAD^ HEAD > changed_files.txt
        fi
        
        # Verifica se só o README.md foi alterado
        if [ "$(cat changed_files.txt | wc -l)" = "1" ] && [ "$(cat changed_files.txt)" = "README.md" ]; then
          echo "readme_only=true" >> $GITHUB_OUTPUT
        else
          echo "readme_only=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Set up Python
      if: steps.check_readme.outputs.readme_only != 'true'
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      if: steps.check_readme.outputs.readme_only != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Start Docker Compose
      if: steps.check_readme.outputs.readme_only != 'true'
      run: |
        docker compose up -d
        sleep 30  # Aumentado para 30 segundos para garantir que os serviços iniciem
    
    - name: Check services health
      if: steps.check_readme.outputs.readme_only != 'true'
      run: |
        # Verifica se o MinIO está respondendo
        curl -f http://localhost:9000/minio/health/live || exit 1
        # Verifica se o Airflow está respondendo
        curl -f http://localhost:8080/health || exit 1
    
    - name: Run ETL Test
      if: steps.check_readme.outputs.readme_only != 'true'
      run: |
        python3 -c "
from etl.extractors.cep_extractor import CEPExtractor
from etl.transformers.cep_transformer import CEPTransformer
from etl.loaders.cep_loader import CEPLoader
from etl.utils.cep_finder import CEPFinder

# Inicializa componentes
cep_finder = CEPFinder()
extractor = CEPExtractor()
transformer = CEPTransformer()
loader = CEPLoader()

# Obtém CEPs de SP
ceps = cep_finder.find_ceps_by_state('SP')
if ceps.empty:
    print('Nenhum CEP encontrado para o estado SP')
    exit(1)

print(f'Processando {len(ceps)} CEPs')

# Lista para armazenar todos os dados
all_data = []

# Processa cada CEP
for _, cep_info in ceps.iterrows():
    try:
        cep = cep_info['cep']
        nome = cep_info['nome']
        
        print(f'Processando CEP: {cep} ({nome})')
        
        # Extrai dados
        raw_data = extractor.extract_cep_data(cep)
        
        if not raw_data:
            print(f'Nenhum dado encontrado para o CEP {cep}')
            continue
        
        # Adiciona informações do local
        raw_data['nome_local'] = nome
        all_data.append(raw_data)
        
    except Exception as e:
        print(f'Erro ao processar CEP {cep}: {str(e)}')
        continue

if not all_data:
    print('Nenhum dado coletado para processar')
    exit(1)

# Transforma os dados
print('Transformando dados...')
df = transformer.transform_batch(all_data)

if df.empty:
    print('Nenhum dado válido após transformação')
    exit(1)

# Carrega os dados
print('Carregando dados...')
if not loader.load_data(df):
    print('Falha ao carregar dados')
    exit(1)

print('ETL concluído com sucesso!')
"
    
    - name: Stop Docker Compose
      if: always() && steps.check_readme.outputs.readme_only != 'true'
      run: docker compose down 