name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
    
    - name: Check for README-only changes
      id: check_readme
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          # Para pull requests, compara com a branch base
          git diff --name-only origin/${{ github.base_ref }} HEAD > changed_files.txt
        else
          # Para pushes, compara com o último commit
          git diff --name-only HEAD^ HEAD > changed_files.txt
        fi
        
        # Verifica se só o README.md foi alterado
        if [ "$(cat changed_files.txt | wc -l)" = "1" ] && [ "$(cat changed_files.txt)" = "README.md" ]; then
          echo "readme_only=true" >> $GITHUB_OUTPUT
        else
          echo "readme_only=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Set up Python
      if: steps.check_readme.outputs.readme_only != 'true'
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      if: steps.check_readme.outputs.readme_only != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build Docker image
      if: steps.check_readme.outputs.readme_only != 'true'
      run: |
        docker build -t flask-app:latest .
    
    - name: Start Docker Compose
      if: steps.check_readme.outputs.readme_only != 'true'
      run: |
        docker compose up -d
        sleep 15  # Aguarda os serviços iniciarem
    
    - name: Check services health
      if: steps.check_readme.outputs.readme_only != 'true'
      run: |
        # Verifica se o MinIO está respondendo
        curl -f http://localhost:9000/minio/health/live || exit 1
        # Verifica se o Flask está respondendo
        curl -f http://localhost:5000/health || exit 1
    
    # - name: Run tests
    #   run: |
    #     python boto_test.py
    
    - name: Stop Docker Compose
      if: always() && steps.check_readme.outputs.readme_only != 'true'
      run: docker compose down 